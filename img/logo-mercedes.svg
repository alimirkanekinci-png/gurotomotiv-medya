<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Mercedes-Benz">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset=".35" stop-color="#b9c0c8"/>
      <stop offset=".55" stop-color="#e9edf1"/>
      <stop offset=".8" stop-color="#8f979f"/>
      <stop offset="1" stop-color="#d9dee3"/>
    </linearGradient>
    <linearGradient id="ringIn" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe4e9"/>
      <stop offset=".5" stop-color="#9aa2aa"/>
      <stop offset="1" stop-color="#eef1f4"/>
    </linearGradient>
    <radialGradient id="face" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="#2b3138"/>
      <stop offset="1" stop-color="#0d1115"/>
    </radialGradient>
    <linearGradient id="starL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c3cad2"/>
    </linearGradient>
    <linearGradient id="starD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aeb6bf"/>
      <stop offset="1" stop-color="#6f777f"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="url(#ring)"/>
  <circle cx="100" cy="100" r="86" fill="url(#ringIn)"/>
  <circle cx="100" cy="100" r="80" fill="url(#face)"/>
  <g transform="translate(100 100)">
    <!-- three-pointed star: each arm is a light half and a shaded half -->
    <g id="arm">
      <polygon points="0,0 -9,0 0,-80" fill="url(#starL)"/>
      <polygon points="0,0 9,0 0,-80" fill="url(#starD)"/>
    </g>
    <use href="#arm" transform="rotate(120)"/>
    <use href="#arm" transform="rotate(240)"/>
    <circle r="7" fill="url(#starL)"/>
  </g>
</svg>
